<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Day to Day Latte</title>
        <link rel="stylesheet" href="/styles.css">
    </head>

    <body>
        <button type="button" id="upload_widget" class="cloudinary-button">Upload Photo(s)</button>
        <!-- <div id="folders"></div> -->
        <div id="gallery"></div>

        <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>
        <script>
            function fetchImages() {
                fetch("/api/images")
                    .then(res => res.json())
                    .then(images => {
                        const container = document.getElementById("gallery");
                        container.innerHTML = "";

                        const folders = [];
                        images.forEach(img => {
                            if (!folders.includes(img.asset_folder)) {
                                folders.push(img.asset_folder);
                            }
                        });

                        folders.sort().reverse();

                        folders.forEach(folderName => {
                            const div = document.createElement("div");
                            div.innerHTML = `<h2>${folderName}</h2>`;
                            container.appendChild(div);

                            images
                                .filter(img => img.asset_folder === folderName)
                                .forEach(img => {
                                    const image = document.createElement("img");
                                    image.src = `https://res.cloudinary.com/dathpxzhg/image/upload/c_fill,w_500,h_600,f_webp,q_auto/${img.public_id}.webp`;
                                    image.loading = "lazy";
                                    div.appendChild(image);
                                });
                        });

                        console.log(folders);
                    });
            }
            
            document.getElementById("upload_widget").addEventListener("click", function() {
                const widget = cloudinary.createUploadWidget({
                    cloudName: "dathpxzhg",
                    uploadPreset: "ml_default",
                    folder: `${new Date().toISOString().split("T")[0]}`,
                    sources: ['local'],
                    resourceType: "image",
                    clientAllowedFormats: ["jpg", "jpeg", "png", "webp"],
                    transformation: [
                        { width: 1920, height: 1440, crop: "fill", format: "webp", quality: 100 }
                    ]
                }, (error, result) => {
                    if (!error && result && result.event === "close") {
                        fetchImages();
                    }
                });

                widget.open();
            }, false);

            fetchImages();
        </script>
    </body>
</html>
